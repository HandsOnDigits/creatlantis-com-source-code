<!doctype html>
<html lang="en" class="scrollbar-none">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CreAtlantis</title>

    <!-- Inline script placed safely in head to prevent white/wrong-theme flash -->
    <script>
      const savedTheme = localStorage.getItem('theme')
      const fallback = 'dark'
      const activeTheme = savedTheme || fallback

      // Apply the theme class to <html> immediately before render
      document.documentElement.classList.add(activeTheme + '-theme')
    </script>
  </head>

  <body>
    <div id="root"></div>

    <footer>
      <a href="../html_documents/privacy_policy.html">Privacy Policy</a>
      <a href="../html_documents/terms_of_use.html">Terms of Use</a>
      <a href="../html_documents/donate.html">Donate to the project</a>
      <a href="../html_documents/help_center.html">Help Center</a>
      <a href="../html_documents/about.html">About</a>
    </footer>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
